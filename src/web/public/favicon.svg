<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Job Hunting Capture: a briefcase (the job) with a spark (the tailoring). Source for the PNGs next to it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1596a8" />
      <stop offset="1" stop-color="#0a4a66" />
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e3eef2" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)" />

  <!-- handle -->
  <path d="M47 44 V35 a9 9 0 0 1 9 -9 h16 a9 9 0 0 1 9 9 V44" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- body -->
  <rect x="20" y="42" width="88" height="64" rx="13" fill="url(#case)" />
  <!-- lid seam -->
  <rect x="20" y="65" width="88" height="5" fill="#0a4a66" opacity="0.22" />
  <!-- clasp -->
  <rect x="55" y="60" width="18" height="15" rx="4.5" fill="#1596a8" />

  <!-- spark -->
  <path d="M103 9 L107.5 20.5 L119 25 L107.5 29.5 L103 41 L98.5 29.5 L87 25 L98.5 20.5 Z" fill="#ffc94a" stroke="#0a4a66" stroke-width="2.5" stroke-linejoin="round" />
</svg>
